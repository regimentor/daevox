[project]
name = "local-ai-web-search"
version = "0.1.0"
description = "HTTP web search and readable page extraction service for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "anyio>=4.9.0",
    "ddgs>=9.14.4",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "markdownify>=1.1.0",
    "playwright>=1.52.0",
    "pydantic-settings>=2.10.1",
    "pypdf>=5.9.0",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "respx>=0.22.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "mypy>=1.17.1",
]

[project.scripts]
websearch = "websearch.main:run"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
