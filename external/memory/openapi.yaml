          description: Retrieval strategy.
          default: hybrid
        limit:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Limit
          description: Maximum number of chunks to return.
        path_prefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Path Prefix
          description: Literal vault-relative path prefix filter.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags that matching notes must contain.
        expand_links:
          type: boolean
