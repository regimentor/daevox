openapi: 3.1.0
info:
  title: Local Obsidian Memory Service
  summary: Local Obsidian-compatible Markdown memory backend for AI agents.
  description: The configured Markdown Vault is the source of truth. SQLite stores
    disposable search indexes, while optional Git endpoints provide explicit Vault
    versioning.
  version: 0.1.0
