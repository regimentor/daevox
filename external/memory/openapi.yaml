components:
  schemas:
    CheckpointRequest:
      properties:
        message:
          type: string
          maxLength: 500
          minLength: 1
          title: Message
          description: Git commit message.
      type: object
      required:
      - message
      title: CheckpointRequest
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine-readable error code.
        message:
          type: string
          title: Message
          description: Human-readable error message.
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
    GitCheckpointResponse:
      properties:
        created:
          type: boolean
          title: Created
        commit:
          anyOf:
          - type: string
          - type: 'null'
          title: Commit
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      required:
      - created
      title: GitCheckpointResponse
    GitCommit:
      properties:
        commit:
          type: string
          title: Commit
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
        author:
          type: string
          title: Author
        message:
          type: string
          title: Message
      type: object
      required:
      - commit
      - author
      - message
      title: GitCommit
    GitDiffResponse:
      properties:
        diff:
          type: string
          title: Diff
      type: object
      required:
      - diff
      title: GitDiffResponse
    GitHistoryResponse:
      properties:
        history:
          items:
            $ref: '#/components/schemas/GitCommit'
          type: array
          title: History
      type: object
      required:
      - history
      title: GitHistoryResponse
    GitInitResponse:
      properties:
        initialized:
          type: boolean
          title: Initialized
        path:
          type: string
          title: Path
      type: object
      required:
      - initialized
      - path
      title: GitInitResponse
    GitStatusResponse:
      properties:
        initialized:
          type: boolean
          title: Initialized
        entries:
          items:
            type: string
          type: array
          title: Entries
      type: object
      required:
      - initialized
      - entries
      title: GitStatusResponse
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    NoteCreate:
      properties:
        path:
          type: string
          title: Path
          description: Vault-relative path ending in `.md`.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Optional Obsidian note title.
        content:
          type: string
          title: Content
          description: Markdown body without YAML frontmatter.
          default: ''
        frontmatter:
          additionalProperties: true
          type: object
          title: Frontmatter
          description: Additional YAML frontmatter. `id`, `created` and `updated`
            are managed by the service.
      type: object
      required:
      - path
      title: NoteCreate
    NoteHistoryResponse:
      properties:
        note_id:
          type: string
          title: Note Id
        history:
          items:
            $ref: '#/components/schemas/GitCommit'
          type: array
          title: History
      type: object
      required:
      - note_id
      - history
      title: NoteHistoryResponse
    NoteMutationResponse:
      properties:
        id:
          type: string
          title: Id
        path:
          type: string
          title: Path
      type: object
      required:
      - id
      - path
      title: NoteMutationResponse
    NoteResponse:
      properties:
        id:
          type: string
          title: Id
        path:
          type: string
          title: Path
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        raw:
          type: string
          title: Raw
        frontmatter:
          additionalProperties: true
          type: object
          title: Frontmatter
        created:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created
        updated:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated
      type: object
      required:
      - id
      - path
      - title
      - content
      - raw
      - frontmatter
      title: NoteResponse
    NoteUpdate:
      properties:
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
          description: New vault-relative `.md` path.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Replacement Obsidian note title.
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: Replacement Markdown body.
        frontmatter:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Frontmatter
          description: Frontmatter fields to merge into the existing note.
      additionalProperties: false
      type: object
      title: NoteUpdate
    ReadyResponse:
      properties:
        ready:
          type: boolean
          title: Ready
        vault:
          type: boolean
          title: Vault
        sqlite:
          type: boolean
          title: Sqlite
        embeddings:
          type: boolean
          title: Embeddings
        embedding_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Error
        git_initialized:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Git Initialized
      type: object
      required:
