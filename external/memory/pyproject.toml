[project]
name = "local-obsidian-memory"
version = "0.1.0"
description = "Local Obsidian-compatible Markdown memory service with hybrid retrieval and Git versioning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1,<1",
    "pydantic-settings>=2.10.1,<3",
    "pyyaml>=6.0.2,<7",
    "sentence-transformers>=5.1.0,<6",
    "sqlite-vec==0.1.9",
    "uvicorn[standard]>=0.35.0,<1",
    "watchfiles>=1.0.0,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "mypy>=1.17.1,<2",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.5,<1",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
memory-service = "memory_service.main:run"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
